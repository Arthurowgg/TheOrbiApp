name: Pages (espelho do site)

# Publica o mesmo build do site no GitHub Pages. É um espelho de leitura:
# o endereço oficial continua sendo o Firebase Hosting (orbi-app-auth.web.app),
# onde o domínio já está autorizado no Authentication.
on:
  push:
    branches: [main, arena/0e280858-theorbiapp]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: |
          npm run build 2>&1 | tail -30 > /tmp/build.log || true
          cat /tmp/build.log
          exit 0

      - name: Desativar Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
