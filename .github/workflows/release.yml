name: Release

# Compila o app Windows, gera o instalador Inno Setup, publica a release e
# entrega o site no Firebase Hosting.
on:
  push:
    branches: [main, arena/0e280858-theorbiapp]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar uma release no GitHub"
        type: boolean
        default: true

permissions:
  contents: write
  checks: write

concurrency:
  group: release-${{ github.ref }}
  # true: uma execução travada (runner preso) não bloqueia as próximas — o push
  # novo cancela a antiga e roda.
  cancel-in-progress: true

jobs:
  web:
    name: Site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

  windows:
    name: App + instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Publica uma PASTA, não um exe único: nada de extração na partida (era o
      # que fazia o app morrer antes de escrever qualquer log).
      - name: Publish (pasta)
        run: >
          dotnet publish app/Orbi.App/Orbi.App.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/publish

      # O app é publicado "framework-dependent": o .NET vai embutido no setup,
      # então o exe é pequeno e não extrai nada na partida.
      - name: Empacotar o app (payload do instalador)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "artifacts\publish\*" -DestinationPath "app\Orbi.Setup\assets\payload.zip" -CompressionLevel Optimal -Force
          $zip = Get-Item "app\Orbi.Setup\assets\payload.zip"
          Write-Host ("payload: " + [math]::Round($zip.Length/1MB,1) + " MB")

      - name: Compilar o instalador (WPF próprio)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish app/Orbi.Setup/Orbi.Setup.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/setup
          New-Item -ItemType Directory -Force -Path artifacts/Installer | Out-Null
          Move-Item artifacts/setup/OrbiSetup.exe "artifacts/Installer/OrbiSetup-1.1.0.exe" -Force

      - name: Checksums
        shell: powershell
        run: |
          $file = Get-ChildItem artifacts\Installer\OrbiSetup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii artifacts\Installer\SHA256SUMS.txt
          Write-Host "SHA-256: $hash"

      - name: Smoke test do instalador
        shell: powershell
        run: |
          $exe = Get-ChildItem artifacts\Installer\OrbiSetup-*.exe | Select-Object -First 1
          if ($exe.Length -lt 3MB) { throw "instalador suspeito: $($exe.Length) bytes" }
          Write-Host ("setups: " + $exe.Name + " · " + [math]::Round($exe.Length/1MB,1) + " MB")

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            artifacts/Installer/OrbiSetup-*.exe
            artifacts/Installer/SHA256SUMS.txt
          retention-days: 14

  # Prova real: executa o app no Windows e lê o relatório do autoteste.
  # Antes disso, "build verde" não significava "o app abre" — e foi assim que
  # um tema XAML quebrado passou por seis versões.
  autoteste:
    name: Autoteste no Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar (exatamente como o instalador publica)
        run: >
          dotnet publish app/Orbi.App/Orbi.App.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/publish

      - name: Rodar o Orbi com --selftest
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"
          $exe = (Resolve-Path "artifacts\publish\Orbi.exe").Path
          Write-Host "exe: $exe"
          Write-Host ("tamanho: " + (Get-Item $exe).Length)

          # --selftest gera o relatorio e CONTINUA aberto (de proposito). Por isso
          # Start-Process + espera limitada + kill: sem isso o job fica travado.
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          Start-Sleep -Seconds 20
          $vivo = -not $p.HasExited
          Write-Host "processo ainda vivo: $vivo"
          if (-not $vivo) { Write-Host ("::error::o app terminou sozinho com codigo " + $p.ExitCode) }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          $pasta = "$env:APPDATA\Orbi"
          if (Test-Path $pasta) { Get-ChildItem $pasta | Select-Object Name, Length | Format-Table | Out-String | Write-Host } else { Write-Host "::error::pasta de dados AUSENTE" }
          foreach ($f in @("sonda.txt", "startup.log", "crash.log", "selftest.txt")) {
            $caminho = Join-Path $pasta $f
            if (Test-Path $caminho) {
              Get-Content $caminho | Select-Object -Last 40 | ForEach-Object { Write-Host "::notice::[$f] $_" }
            } else {
              Write-Host "::warning::[$f] AUSENTE"
            }
          }

          $relatorio = Join-Path $pasta "selftest.txt"
          if (-not (Test-Path $relatorio)) { Write-Host "::error::sem selftest.txt"; exit 1 }
          $texto = Get-Content $relatorio -Raw
          $falhas = ($texto -split "`n") | Where-Object { $_ -match "FALHOU|SEM TAMANHO|vazia" }
          if ($falhas) { $falhas | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          if ($texto -notmatch "RESULTADO: tudo abriu") { Write-Host "::error::resultado inesperado"; exit 1 }
          Write-Host "Autoteste passou."

      - name: Guardar os logs do autoteste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoteste-logs
          # Caminho fixo do runner Windows: C:\Users\runneradmin\AppData\Roaming
          path: |
            C:/Users/runneradmin/AppData/Roaming/Orbi/selftest.txt
            C:/Users/runneradmin/AppData/Roaming/Orbi/startup.log
            C:/Users/runneradmin/AppData/Roaming/Orbi/crash.log
            C:/Users/runneradmin/AppData/Roaming/Orbi/ultima-execucao.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar o relatório do autoteste
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $relatorio = "$env:APPDATA\Orbi\selftest.txt"
          $inicio = "$env:APPDATA\Orbi\startup.log"
          $crash = "$env:APPDATA\Orbi\crash.log"
          $partes = @()
          foreach ($f in @($inicio, $crash, $relatorio)) {
            if (Test-Path $f) {
              $partes += "### $([System.IO.Path]::GetFileName($f))"
              $partes += '```'
              $partes += (Get-Content $f -Tail 60)
              $partes += '```'
            } else {
              $partes += "_$([System.IO.Path]::GetFileName($f)): AUSENTE_"
            }
          }
          $resumo = ($partes -join "`n")
          $sha = "${{ github.sha }}"
          $id = (gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --jq '.check_runs[] | select(.name=="Autoteste no Windows") | .id' | Select-Object -First 1)
          $corpo = @{ output = @{ title = "Autoteste do Orbi"; summary = $resumo } } | ConvertTo-Json -Depth 5
          $corpo | Out-File -FilePath corpo.json -Encoding utf8
          if ($id) { gh api -X PATCH "repos/${{ github.repository }}/check-runs/$id" --input corpo.json 2>&1 | Out-Null }
          Write-Host $resumo

  release:
    name: Publicar release
    needs: [windows, autoteste]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: artifacts

      - name: Criar/atualizar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Orbi 1.1.0
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/Installer/OrbiSetup-1.1.0.exe
            artifacts/Installer/SHA256SUMS.txt
          body: |
            ## Orbi 1.1.0 — para Windows 11

            Instalador único, sem Python, sem privilégio de administrador.

            **Baixe `OrbiSetup-1.1.0.exe`** e execute. Na primeira vez, o Orbi mostra uma
            janela de boas-vindas (prova de que ele abriu) e o diagnóstico. Depois, aperte
            `Alt+Shift+O` em qualquer lugar do Windows.

            Se nada aparecer, use o atalho **Orbi (autoteste)** no menu Iniciar e mande o
            arquivo `%APPDATA%\Orbi\selftest.txt`.

            - Barra de comando global com atalhos, histórico e sugestões
            - Comandos em português: abrir apps, volume, brilho, energia, captura
            - Lembretes, notas, atalhos de texto e apelidos de apps
            - Status do PC (CPU, memória, disco, bateria)
            - Bloqueio por inatividade com aviso e exceções
            - Gemini opcional (chave gratuita do AI Studio, cifrada com DPAPI)
            - **Conta única com o site** (Firebase Authentication) e sincronização de apelidos,
              atalhos, rotinas e preferências pelo Firestore — notas, área de transferência e a
              chave do Gemini continuam só neste PC
            - Rotinas criadas no site executadas no app ("modo estudo")

            **Verificação:** compare o SHA-256 com `SHA256SUMS.txt`.

            ```powershell
            certutil -hashfile OrbiSetup-1.1.0.exe SHA256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
