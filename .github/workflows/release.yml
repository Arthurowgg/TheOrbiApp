name: Release

# Compila o app Windows, gera o instalador Inno Setup, publica a release e
# entrega o site no Firebase Hosting.
on:
  push:
    branches: [main, arena/0e280858-theorbiapp]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar uma release no GitHub"
        type: boolean
        default: true

permissions:
  contents: write
  checks: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

  windows:
    name: App + instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore app/Orbi.App/Orbi.App.csproj

      - name: Build (Release)
        run: dotnet build app/Orbi.App/Orbi.App.csproj -c Release --no-restore

      - name: Publish single-file self-contained
        run: >
          dotnet publish app/Orbi.App/Orbi.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/publish

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador
        shell: powershell
        run: |
          # O runner liga $ErrorActionPreference=Stop: sem isso, qualquer linha
          # que o ISCC escreve em stderr aborta o script antes de gravar o log.
          $ErrorActionPreference = "Continue"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $saida = & $iscc "app\installer\orbi.iss" *>&1 | Out-String
          Set-Content -Path "iscc.log" -Value $saida -Encoding utf8
          $codigo = $LASTEXITCODE
          $linhas = $saida -split "`n"
          $erros = $linhas | Where-Object { $_ -match "Error|error|Erro" } | Select-Object -First 4
          if (-not $erros) { $erros = $linhas | Where-Object { $_.Trim() } | Select-Object -Last 4 }
          $erros | ForEach-Object { Write-Host "::error::$_" }
          if ($codigo -ne 0) { throw "ISCC falhou com codigo $codigo" }

      - name: Salvar o log do instalador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-log
          path: iscc.log
          retention-days: 7

      - name: Checksums
        shell: powershell
        run: |
          $file = Get-ChildItem artifacts\OrbiSetup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii artifacts\SHA256SUMS.txt
          "installer=$($file.FullName)" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"

      - name: Smoke test do executável
        shell: powershell
        run: |
          # Confere que o binário publicado existe e tem tamanho plausível.
          $exe = Get-ChildItem artifacts\publish\Orbi.exe
          if ($exe.Length -lt 5MB) { throw "Orbi.exe suspeito: $($exe.Length) bytes" }
          Write-Host "Orbi.exe: $([math]::Round($exe.Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            artifacts/OrbiSetup-*.exe
            artifacts/SHA256SUMS.txt
          retention-days: 14

  # Prova real: executa o app no Windows e lê o relatório do autoteste.
  # Antes disso, "build verde" não significava "o app abre" — e foi assim que
  # um tema XAML quebrado passou por seis versões.
  autoteste:
    name: Autoteste no Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar
        run: >
          dotnet publish app/Orbi.App/Orbi.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/publish

      # Publica o relatório num check-run: o log do runner não é legível pela API,
      # mas as anotações são. É assim que o resultado chega para quem precisa dele.
      - name: Publicar o relatório do autoteste
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $relatorio = "$env:APPDATA\Orbi\selftest.txt"
          $inicio = "$env:APPDATA\Orbi\startup.log"
          $crash = "$env:APPDATA\Orbi\crash.log"
          $partes = @()
          foreach ($f in @($inicio, $crash, $relatorio)) {
            if (Test-Path $f) {
              $partes += "### $([System.IO.Path]::GetFileName($f))"
              $partes += '```'
              $partes += (Get-Content $f -Tail 60)
              $partes += '```'
            } else {
              $partes += "_$([System.IO.Path]::GetFileName($f)): AUSENTE_"
            }
          }
          $resumo = ($partes -join "`n")
          $sha = "${{ github.sha }}"
          $corpo = @{ output = @{ title = "Autoteste do Orbi"; summary = $resumo } } | ConvertTo-Json -Depth 5
          $corpo | Out-File -FilePath corpo.json -Encoding utf8
          gh api -X PATCH "repos/${{ github.repository }}/check-runs/${{ job.check_run_id }}" --input corpo.json 2>&1 | Out-Null
          Write-Host $resumo

      - name: Rodar o Orbi com --selftest
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $exe = "artifacts\publish\Orbi.exe"
          $log = "$env:APPDATA\Orbi\selftest.txt"
          $ini = "$env:APPDATA\Orbi\ultima-execucao.txt"
          Remove-Item $log, $ini -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Host "::warning::o processo terminou sozinho com código $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          # Tudo o que interessa vai para anotação: o log do runner não é legível.
          if (Test-Path $ini) { Get-Content $ini | ForEach-Object { Write-Host "::notice::exec: $_" } }
          if (Test-Path "$env:APPDATA\Orbi\startup.log") {
            Get-Content "$env:APPDATA\Orbi\startup.log" | Select-Object -Last 40 | ForEach-Object { Write-Host "::notice::startup: $_" }
          }
          if (Test-Path "$env:APPDATA\Orbi\crash.log") {
            Get-Content "$env:APPDATA\Orbi\crash.log" | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::crash: $_" }
          }

          if (-not (Test-Path $log)) {
            Write-Host "::error::sem selftest.txt — o app não chegou a rodar a interface"
            exit 1
          }

          $texto = Get-Content $log -Raw
          $texto -split "`n" | ForEach-Object { if ($_.Trim()) { Write-Host "::notice::$_" } }

          $falhas = ($texto -split "`n") | Where-Object { $_ -match "FALHOU|SEM TAMANHO|vazia" }
          if ($falhas) {
            $falhas | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          if ($texto -notmatch "RESULTADO: tudo abriu") {
            Write-Host "::error::resultado inesperado no autoteste"
            exit 1
          }
          Write-Host "Autoteste passou."

  release:
    name: Publicar release
    needs: [windows, autoteste]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: artifacts

      - name: Criar/atualizar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: Orbi 1.0.8
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/OrbiSetup-1.0.8.exe
            artifacts/SHA256SUMS.txt
          body: |
            ## Orbi 1.0.8 — para Windows 11

            Instalador único, sem Python, sem privilégio de administrador.

            **Baixe `OrbiSetup-1.0.8.exe`** e execute. Na primeira vez, o Orbi mostra uma
            janela de boas-vindas (prova de que ele abriu) e o diagnóstico. Depois, aperte
            `Alt+Shift+O` em qualquer lugar do Windows.

            Se nada aparecer, use o atalho **Orbi (autoteste)** no menu Iniciar e mande o
            arquivo `%APPDATA%\Orbi\selftest.txt`.

            - Barra de comando global com atalhos, histórico e sugestões
            - Comandos em português: abrir apps, volume, brilho, energia, captura
            - Lembretes, notas, atalhos de texto e apelidos de apps
            - Status do PC (CPU, memória, disco, bateria)
            - Bloqueio por inatividade com aviso e exceções
            - Gemini opcional (chave gratuita do AI Studio, cifrada com DPAPI)
            - **Conta única com o site** (Firebase Authentication) e sincronização de apelidos,
              atalhos, rotinas e preferências pelo Firestore — notas, área de transferência e a
              chave do Gemini continuam só neste PC
            - Rotinas criadas no site executadas no app ("modo estudo")

            **Verificação:** compare o SHA-256 com `SHA256SUMS.txt`.

            ```powershell
            certutil -hashfile OrbiSetup-1.0.8.exe SHA256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
