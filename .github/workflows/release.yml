name: Release

# Compila o app Windows, gera o instalador Inno Setup, publica a release e
# entrega o site no Firebase Hosting.
on:
  push:
    branches: [main, arena/0e280858-theorbiapp]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar uma release no GitHub"
        type: boolean
        default: true

permissions:
  contents: write
  checks: write

concurrency:
  group: release-${{ github.ref }}
  # true: uma execução travada (runner preso) não bloqueia as próximas — o push
  # novo cancela a antiga e roda.
  cancel-in-progress: true

jobs:
  web:
    name: Site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

  windows:
    name: App + instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Publica uma PASTA, não um exe único: nada de extração na partida (era o
      # que fazia o app morrer antes de escrever qualquer log).
      - name: Publish (pasta)
        run: >
          dotnet publish app/Orbi.App/Orbi.App.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/publish

      # O app é publicado "framework-dependent": o .NET vai embutido no setup,
      # então o exe é pequeno e não extrai nada na partida.
      - name: Empacotar o app (payload do instalador)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "artifacts\publish\*" -DestinationPath "app\Orbi.Setup\assets\payload.zip" -CompressionLevel Optimal -Force
          $zip = Get-Item "app\Orbi.Setup\assets\payload.zip"
          Write-Host ("payload: " + [math]::Round($zip.Length/1MB,1) + " MB")
          if ($zip.Length -lt 20MB) {
            $pub = (Get-ChildItem "artifacts\publish" -Recurse | Measure-Object Length -Sum)
            Write-Host "::error::payload pequeno demais: $([math]::Round($zip.Length/1MB,1)) MB; publish tem $([math]::Round($pub.Sum/1MB,1)) MB em $($pub.Count) arquivos"
            throw "payload incompleto"
          }

      - name: Compilar o instalador (WPF próprio)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish app/Orbi.Setup/Orbi.Setup.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/setup
          New-Item -ItemType Directory -Force -Path artifacts/Installer | Out-Null
          Move-Item artifacts/setup/OrbiSetup.exe "artifacts/Installer/OrbiSetup-1.1.1.exe" -Force

      # Prova que o instalador instala e desinstala de verdade, sem abrir janela.
      - name: Instalar e desinstalar (silencioso)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem artifacts\Installer\OrbiSetup-*.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:LOCALAPPDATA "Programs\Orbi"
          $log = Join-Path $env:LOCALAPPDATA "Orbi-setup.log"

          $p = Start-Process $setup -ArgumentList "--silent" -PassThru -Wait
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "  $_" } }
          if ($p.ExitCode -ne 0) { throw "instalador saiu com código $($p.ExitCode)" }

          $exe = Join-Path $target "Orbi.exe"
          $des = Join-Path $target "Desinstalar.exe"
          if (-not (Test-Path $exe)) { throw "Orbi.exe não foi instalado em $target" }
          if (-not (Test-Path $des)) { throw "Desinstalar.exe não foi instalado em $target" }
          if ((Get-Item $exe).Length -lt 100KB) { throw "Orbi.exe instalado está vazio" }
          $uninst = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Orbi" -ErrorAction Stop).UninstallString
          Write-Host "instalado: $exe"
          Write-Host "desinstalador: $uninst"

          $p2 = Start-Process $des -ArgumentList "--uninstall --silent" -PassThru -Wait
          if ($p2.ExitCode -ne 0) { throw "desinstalador saiu com código $($p2.ExitCode)" }
          if (Test-Path $exe) { throw "Orbi.exe continuou instalado depois de desinstalar" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Orbi") {
            throw "entrada de desinstalação continuou no registro"
          }
          Write-Host "::notice::instalou, registrou e desinstalou sem administrador"

      - name: Checksums
        shell: powershell
        run: |
          $file = Get-ChildItem artifacts\Installer\OrbiSetup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii artifacts\Installer\SHA256SUMS.txt
          Write-Host "SHA-256: $hash"

      - name: Smoke test do instalador
        shell: powershell
        run: |
          $exe = Get-ChildItem artifacts\Installer\OrbiSetup-*.exe | Select-Object -First 1
          if ($exe.Length -lt 20MB) { throw "instalador suspeito (sem o app dentro?): $($exe.Length) bytes" }
          Write-Host ("setups: " + $exe.Name + " · " + [math]::Round($exe.Length/1MB,1) + " MB")
          Write-Host "::notice::instalador $($exe.Name) com $([math]::Round($exe.Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            artifacts/Installer/OrbiSetup-*.exe
            artifacts/Installer/SHA256SUMS.txt
          retention-days: 14

  # Prova real: executa o app no Windows e lê o relatório do autoteste.
  # Antes disso, "build verde" não significava "o app abre" — e foi assim que
  # um tema XAML quebrado passou por seis versões.
  autoteste:
    name: Autoteste no Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar (exatamente como o instalador publica)
        run: >
          dotnet publish app/Orbi.App/Orbi.App.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/publish

      # O app abre de verdade? É isso que importa — build verde não prova nada.
      - name: Abrir o Orbi e conferir o log
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          function Falhar($msg) {
            Write-Host "::error::$msg"
            $pasta = "$env:APPDATA\Orbi"
            Write-Host "pasta existe: $(Test-Path $pasta)"
            if (Test-Path $pasta) { Get-ChildItem $pasta | Select-Object Name, Length | Format-Table | Out-String | Write-Host }
            Write-Host "eventos de aplicativo (últimos):"
            try {
              Get-WinEvent -LogName Application -MaxEvents 8 |
                Where-Object { $_.ProviderName -match "Application Error|.NET Runtime" } |
                ForEach-Object { Write-Host ("::error::" + ($_.Message -split "`n")[0..3] -join " ") }
            } catch { }
            exit 1
          }

          $exe = (Resolve-Path "artifacts\publish\Orbi.exe").Path
          Write-Host "exe: $exe ($([math]::Round((Get-Item $exe).Length/1MB,1)) MB)"

          $p = Start-Process -FilePath $exe -ArgumentList "--tray" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Falhar "o Orbi fechou sozinho (código $($p.ExitCode))" }

          $log = "$env:APPDATA\Orbi\orbi.log"
          if (-not (Test-Path $log)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Falhar "o Orbi está rodando mas não escreveu orbi.log (travou numa janela de erro?)"
          }

          Get-Content $log | ForEach-Object { Write-Host "  $_" }
          $texto = Get-Content $log -Raw
          if ($texto -notmatch "Orbi iniciando") {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Falhar "log sem a linha de inicialização"
          }

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "::notice::o Orbi abriu e registrou a inicialização"

      - name: Guardar o log do Orbi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoteste-logs
          path: C:/Users/runneradmin/AppData/Roaming/Orbi/orbi.log
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publicar release
    needs: [windows, autoteste]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: artifacts

      - name: Criar/atualizar a release
        uses: softprops/action-gh-release@v2
        with:
          # nome fixo: o asset é substituído pelo build mais novo
          fail_on_unmatched_files: true
          tag_name: v1.1.1
          name: Orbi 1.1.1
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/OrbiSetup-1.1.1.exe
            artifacts/SHA256SUMS.txt
          body: |
            ## Orbi 1.1.1 — para Windows 11

            Instalador único, sem Python, sem privilégio de administrador.

            **Baixe `OrbiSetup-1.1.1.exe`** e execute. O Orbi abre como uma barra de
            comando; aperte `Alt+Shift+O` em qualquer lugar do Windows para chamar.

            - **120+ ferramentas do Windows**: áudio, brilho, energia, painéis de
              configuração, apps, janelas, pastas, rede e acessibilidade
            - Barra fina de comando: `Enter` executa, `/` abre o catálogo, `F1` também
            - **Modo Cloud (Gemini)** opcional, com chave gratuita do AI Studio cifrada
              com DPAPI — ou sem chave, usando só as ferramentas locais
            - Lembretes, notas, histórico de cópia e memória do dia
            - **Conta única com o site**: o que você cria no site aparece no app

            **Verificação:** compare o SHA-256 com `SHA256SUMS.txt`.

            ```powershell
            certutil -hashfile OrbiSetup-1.1.1.exe SHA256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
